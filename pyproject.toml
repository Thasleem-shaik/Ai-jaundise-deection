[project]
name = "ai-jaundice-detection"
version = "0.1.0"
description = "A Streamlit prototype for AI-assisted jaundice screening"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "opencv-python>=5,<6",
    "pillow>=12,<13",
    "streamlit>=1.62,<2",
]

[project.optional-dependencies]
training = [
    "tensorflow>=2.21,<3",
]

[tool.uv]
package = false
